name: SEO

# 1) A cada envio: o vigia confere o site (links, títulos, dado estruturado, cópia entre páginas de cidade).
#    Se achar problema crítico, a execução fica vermelha e o GitHub avisa por e-mail.
# 2) Depois que o GitHub Pages termina de publicar: avisa o Bing e os outros buscadores do IndexNow.
#    (O Google não participa do IndexNow.)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigia:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vigia de SEO
        run: python3 .github/seo/vigia.py

  indexnow:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avisar buscadores (IndexNow)
        run: python3 .github/seo/indexnow.py
